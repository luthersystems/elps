version: "2"
run:
  timeout: 2m
linters:
  enable:
    - gosec
  settings:
    govet:
      enable:
        # fieldalignment guards the struct layout of the interpreter core.
        # LVal/LEnv/Runtime/CallStack are allocated per value / per env / per
        # call, so their field order decides how many bytes the GC must scan
        # on every mark. It is scoped to the hot packages by the exclusion
        # rules below — see .golangci.yml exclusions and issue #304.
        - fieldalignment
    staticcheck:
      checks:
        - "all"
        - "-SA1019" # Allow deprecated usage during migration to *Context methods
        - "-ST*"    # Preserve pre-existing style check behavior
  exclusions:
    rules:
      # --- fieldalignment scope -------------------------------------------
      # fieldalignment is enforced ONLY on the interpreter core (lisp/*.go)
      # and the parser/lexer (parser/**), where structs are allocated per
      # value, per env, per call and per token — the places where field order
      # actually costs something at run time.
      #
      # Everywhere else (lsp/, mcpserver/, analysis/, lint/, formatter/,
      # minifier/, diagnostic/, cmd/, repl/, elpstest/, lisp/lisplib/ and the
      # experimental lisp/x/ debugger + profiler) the flagged structs are
      # allocated once per process, per request or per debug session. There,
      # reordering buys a handful of bytes on a single allocation and costs
      # the logical grouping and per-field doc comments that make the structs
      # readable, so the check is off.
      #
      # This exclusion can only shrink: to protect another package, remove it
      # from the negative lookahead below and fix its findings.
      - linters:
          - govet
        text: "fieldalignment:"
        path-except: '^(lisp/[^/]+\.go|parser/)'

      # Test files are exempt: table-driven test fixtures and mock structs are
      # written for readability and are not on any hot path.
      - linters:
          - govet
        text: "fieldalignment:"
        path: '_test\.go'
