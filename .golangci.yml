version: "2"
run:
  timeout: 5m
issues:
  # Report EVERY finding. golangci-lint's defaults (max-issues-per-linter: 50,
  # max-same-issues: 3) silently collapse repeats, which makes `golangci-lint
  # run` under-report by a wide margin: on the tree that enabled the linters
  # below, the defaults showed ~110 findings where there were ~350 (testifylint
  # 32 shown / 173 real, perfsprint 12 / 47, intrange 6 / 43). The exit code is
  # correct either way, but a truncated list makes "fix and re-run" an
  # open-ended loop and makes any measurement of lint debt wrong. A gate that
  # hides findings lies about how much is left.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gosec
    - intrange
    - makezero
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      # The class of defect this guards is a switch over lisp.LType — the
      # interpreter's core value tag — that silently produces nothing for a
      # type nobody thought about. Downstream (substrate) that output becomes
      # chaincode state, so "serialised as nothing" means "written to a
      # ledger".
      #
      # A switch that already carries a `default:` has made an explicit
      # decision about the types it does not name, so it is not a silent
      # fallthrough. Without this setting the linter reports 75 switches; with
      # it, 26 — the ones with NO default. All 26 were resolved rather than
      # excluded.
      #
      # NOTE when re-measuring: golangci-lint's default `max-same-issues: 3`
      # collapses identical messages, so a plain run under-reports these as
      # 50/24. Use `issues.max-same-issues: 0` to see the real counts.
      default-signifies-exhaustive: true
    govet:
      enable:
        # fieldalignment guards the struct layout of the interpreter. LVal,
        # LEnv, Runtime and CallStack are allocated per value / per env / per
        # call, so their field order decides how many bytes the GC must scan on
        # every mark. It is scoped by the exclusion rules below — see #304.
        - fieldalignment
    staticcheck:
      checks:
        - "all"
        - "-SA1019" # Allow deprecated usage during migration to *Context methods
        - "-ST*"    # Preserve pre-existing style check behavior
  exclusions:
    rules:
      # --- fieldalignment scope -------------------------------------------
      # Enforced across the whole interpreter (lisp/...) and the parser/lexer
      # (parser/...). The point of this check is to be a REGRESSION GUARD, not
      # an optimisation — the alignment sweep that introduced it produced no
      # measurable speedup. So the guard deliberately covers whole trees rather
      # than only the files that happen to be hot today: a newly-added struct
      # in, say, lisp/lisplib/libjson (hot for every statedb read/write in
      # substrate) must be covered the day it lands, not the day someone
      # notices. Narrowing this to today's hot files is how CallFrame grew
      # unnoticed in the first place.
      #
      # Everything outside those two trees is tooling — lsp/, mcpserver/,
      # analysis/, lint/, formatter/, minifier/, diagnostic/, cmd/, repl/,
      # elpstest/ — where structs are built once per process or per request.
      # Those are excluded simply because they are cold and the churn is not
      # worth it, NOT because of any ordering constraint: the repo has zero
      # JSONEq assertions and no golden files, and of the six flagged
      # mcpserver structs only Location carries json tags at all (Server,
      # serviceConfig, service, workspaceState and workspaceFile have no tags
      # and are never marshalled).
      #
      # This exclusion can only shrink: to protect another package, remove it
      # from the negative lookahead below and fix its findings.
      - linters:
          - govet
        text: "fieldalignment:"
        path-except: '^(lisp/|parser/)'

      # lisp/x/ is the experimental debugger + profiler: off by default and
      # allocated once per debug session. fieldalignment's suggested order
      # dissolves ~15 documented field groupings in Engine and dapserver's
      # handler (things like the mu-guarded block, the pauseCh/pausedEnv pair
      # and the readyCh/readyOnce pair) to reclaim 8-16 bytes once per session.
      # Readability wins. Delete this rule and fix the findings if any of it
      # ever moves onto a hot path.
      - linters:
          - govet
        text: "fieldalignment:"
        path: '^lisp/x/'

      # Test files are exempt: table-driven fixtures and mock structs are
      # written for readability and are not on any hot path.
      - linters:
          - govet
        text: "fieldalignment:"
        path: '_test\.go'

      # --- nilerr: "error means absent / reported in the payload" ----------
      # nilerr flags `if err != nil { return nil }`. In these three files that
      # shape is the contract, not a swallowed error, and "fixing" it would
      # change runtime behaviour:
      #
      #   analysis/workspace.go   — inside filepath.Walk's WalkFunc. Returning
      #                             the walk error aborts the ENTIRE workspace
      #                             scan; returning nil skips one unreadable
      #                             entry and keeps indexing. A single
      #                             permission-denied directory must not blank
      #                             the LSP's cross-file symbol table.
      #   lsp/formatting.go       — textDocument/formatting on a file that does
      #                             not parse yet. The handler already carries
      #                             the comment "return nil edits (not an
      #                             error) so the editor doesn't show an error
      #                             dialog for incomplete code" — an LSP error
      #                             response pops a modal on every keystroke.
      #   mcpserver/service.go    — MCP tool handlers. A lookup miss or a parse
      #                             error is part of the tool RESULT
      #                             (DocResponse{Found: false},
      #                             TestResponse{...Error: parseErr.Error()},
      #                             EvalResponse{Error: ...}), not a
      #                             protocol-level failure. Returning a Go
      #                             error here turns a well-formed "not found"
      #                             into an MCP transport error.
      #
      # Scoped to the three exact files, not their directories. This exclusion
      # can only shrink: delete a path here and fix its findings.
      - linters:
          - nilerr
        path: '^(analysis/workspace\.go|lsp/formatting\.go|mcpserver/service\.go)$'

      # --- noctx: dapserver's context-free exported listeners --------------
      # Server.ServeTCP(addr string) and Server.ServeTCPLoop(addr string) are
      # exported API consumed by embedders (substrate attaches to the DAP
      # server), and neither takes a context.Context. The only way to satisfy
      # noctx without an API change is
      # `(&net.ListenConfig{}).Listen(context.Background(), ...)`, which is
      # byte-for-byte what net.Listen already does — pure ceremony that adds
      # no cancellation. The honest fix is a ctx-taking ServeTCPContext /
      # ServeTCPLoopContext pair, which is an API addition and not part of a
      # lint-enablement change.
      #
      # Every other noctx finding WAS fixed (t.Context() threaded through
      # exec.CommandContext in cmd/mcp_test.go, net.Dialer.DialContext and
      # net.ListenConfig.Listen in lsp/e2e_test.go and dapserver's
      # handler_test.go), so this exclusion is exactly two call sites. It can
      # only shrink: delete it when the ctx-taking variants land.
      - linters:
          - noctx
        path: '^lisp/x/debugger/dapserver/server\.go$'

      # --- testifylint require-error: assert.* used as a VALUE -------------
      # testifylint's require-error check wants assert.NoError -> require.NoError.
      # It cannot apply where the assertion's bool result drives control flow,
      # because require.* returns nothing:
      #
      #   elpstest/sortedmap.go              — `if !assert.NoError(t, err) {
      #                                         return false }`. This is the
      #                                         body of the EXPORTED helper
      #                                         elpstest.AssertSortedMap(t, m)
      #                                         bool. require.NoError calls
      #                                         t.FailNow() and never returns,
      #                                         so the helper could no longer
      #                                         report "this map is bad" to its
      #                                         caller — an exported-API change
      #                                         to satisfy a linter.
      #   lisp/lisplib/libjson/encode_test.go — `if !assert.NoError(...) {
      #                                         continue }` inside a
      #                                         100-iteration fuzz-ish loop.
      #                                         require aborts the whole test on
      #                                         the first bad sample instead of
      #                                         reporting every failing input.
      #
      # Every other require-error finding WAS fixed (23 bare `assert.Error` /
      # `assert.NoError` statements followed by a deref of the value under
      # test became require.*), and the one float-compare finding was fixed by
      # comparing the JSON-decoded LSP line number as an int. This exclusion is
      # scoped to the two exact files and can only shrink.
      - linters:
          - testifylint
        text: 'require-error'
        path: '^(elpstest/sortedmap\.go|lisp/lisplib/libjson/encode_test\.go)$'
