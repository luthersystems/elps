name: Security

# The org's shared security checks: govulncheck, gosec, gitleaks and
# osv-scanner, from luthersystems/.github. One workflow in every repo gives
# each repo the same checks, tool versions and fail rule, and an org ruleset
# requires its one check, "security / result". How to exempt a finding and
# why each check exists: docs/security-workflow.md in luthersystems/.github.

on:
  # The merge queue runs the required checks on the merged result.
  merge_group:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A scheduled run finds advisories published after the last change, and
    # opens a security-drift issue when one appears.
    # Nightly: this repo is public, so Actions minutes are free.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id must stay "security": the ruleset requires "security / result".
  security:
    permissions:
      contents: read
      issues: write # the security-drift issue on scheduled runs
    # Pinned to the commit of v1.3.0, as this repo pins every action
    # (scripts/ci-gates-test.sh); Dependabot moves it. The actions the called
    # workflow uses still follow luthersystems/.github's v1 tag.
    uses: luthersystems/.github/.github/workflows/security.yml@632782e52f21c622dede51d8cf8f95a41b1cbd3d # v1.3.0
