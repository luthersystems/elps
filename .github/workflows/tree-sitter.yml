name: Tree-sitter Grammar Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "tree-sitter-elps/**"
  push:
    branches:
      - main
    paths:
      - "tree-sitter-elps/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tree-sitter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: tree-sitter-elps/go.sum

      - name: Download dependencies
        working-directory: tree-sitter-elps
        run: go mod download

      - name: Tests
        working-directory: tree-sitter-elps
        run: go test -v ./...
