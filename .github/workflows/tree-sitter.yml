name: Tree-sitter Grammar Tests
on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'
    # NO `paths:` filter, deliberately -- see the "Required: tree-sitter" job
    # below. A path-filtered workflow does not run at all on a PR that touches
    # nothing it matches, so its checks never report; and a REQUIRED check that
    # never reports blocks the PR forever, with only a settings edit to clear
    # it. Since this workflow's aggregate is meant to be a required check, it
    # has to report on every PR.
    #
    # The cost is one small job (checkout, Go, `go test` on a single module)
    # per PR, which is a fair price for a gate that is honest about whether the
    # grammar still builds.
    #
    # The `push` trigger below keeps its filter: pushes have no required
    # checks, so skipping there blocks nothing.
  push:
    branches:
      - main
    paths:
      - "tree-sitter-elps/**"

# DOCS-ONLY PULL REQUESTS. The `changes` job runs scripts/docs-only-changes.sh
# and the heavy jobs below carry `if: needs.changes.outputs.docs_only != 'true'`,
# so a pull request that changes only documentation skips them. The workflow
# itself is NOT path-filtered: the `Required: *` aggregate still runs on every
# PR and passes a docs-only skip only through scripts/require-jobs-succeeded.sh,
# which accepts `skipped` solely when DOCS_ONLY is `true` on a pull_request
# event and still fails on any `failure` or `cancelled`. Pushes to main and
# scheduled/dispatched runs always get docs_only=false, so they run everything.
# What counts as docs-only is documented in that script.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DOCS-ONLY DETECTION -- see "DOCS-ONLY PULL REQUESTS" at the top of this
  # file. Cheap (one shallow checkout, one git diff), runs on EVERY event, and
  # is upstream of the aggregate so its own failure fails the required check.
  changes:
    name: Detect docs-only change
    # ARM for the reason spelled out on elps.yml's lint-and-test job.
    runs-on: ubuntu-24.04-arm
    # 5 minutes against a job that is a checkout and a `git diff`. It gates
    # every heavy job and feeds the required aggregate, so it must be bounded.
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The PR merge commit plus its parents, so HEAD^1..HEAD is exactly
          # what merging this PR changes on the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/docs-only-changes.sh

  test:
    name: Tree-sitter Tests
    # ARM for the reason spelled out on elps.yml's lint-and-test job.
    # go-tree-sitter is cgo, but it COMPILES the grammar's C sources from the
    # module rather than downloading a prebuilt object, and the image ships
    # gcc for aarch64 -- so there is no arch-shaped artifact to be missing.
    # Nothing here runs the npm/node-gyp side of tree-sitter-elps.
    runs-on: ubuntu-24.04-arm
    # 20 minutes for a Go module download plus `go test ./...` over the
    # grammar package. A liveness bound, not a performance budget.
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.26.8"
          cache: true
          cache-dependency-path: tree-sitter-elps/go.sum

      - name: Download dependencies
        working-directory: tree-sitter-elps
        run: go mod download

      - name: Tests
        working-directory: tree-sitter-elps
        run: go test -v ./...

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: tree-sitter"
    # ARM for the reason on elps.yml's lint-and-test job.
    runs-on: ubuntu-24.04-arm
    # 5 minutes for one bash assertion over `needs` results.
    timeout-minutes: 5
    needs: [changes, test]
    if: always()
    steps:
      # NOTE: this checkout is NEW -- see the same note in elps.yml (#493).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Delegated, NOT inlined (#493) -- see the note in elps.yml.
      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/require-jobs-succeeded.sh
