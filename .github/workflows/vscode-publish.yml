name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: Build elps (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A cross-compile per matrix leg. 20 minutes is a liveness bound: the
    # `go build` is seconds, but Go module download reaches the network and
    # this workflow gates a release, so a wedged leg stalls the publish with
    # nothing going red until GitHub's 6h default expires.
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-x64
          - goos: linux
            goarch: arm64
            target: linux-arm64
          - goos: darwin
            goarch: amd64
            target: darwin-x64
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
          # Windows excluded: tliron/kutil dependency has broken
          # Windows cross-compilation (EnableWindowsANSIConsole).
          # Windows users get the universal (no-binary) package.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build binary
        run: |
          mkdir -p editors/vscode/bin
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -trimpath \
            -o editors/vscode/bin/elps${{ matrix.ext }} .
          chmod +x editors/vscode/bin/elps${{ matrix.ext }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: binary-${{ matrix.target }}
          path: editors/vscode/bin/

  publish-platform:
    name: Publish (${{ matrix.target }})
    needs: build-binaries
    runs-on: ubuntu-latest
    # `npm ci` and `npx vsce publish` both talk to third-party registries
    # (npm, the VS Code Marketplace) which can and do hang. 20 minutes turns
    # that into a red leg instead of a release that never finishes.
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: linux-x64
          - target: linux-arm64
          - target: darwin-x64
          - target: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: binary-${{ matrix.target }}
          path: editors/vscode/bin/

      - name: Ensure executable
        run: chmod +x editors/vscode/bin/elps*

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Set version in package.json
        working-directory: editors/vscode
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build extension
        working-directory: editors/vscode
        run: npm run build

      - name: Publish platform package
        working-directory: editors/vscode
        run: npx vsce publish --target ${{ matrix.target }} -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-universal:
    name: Publish (universal)
    needs: build-binaries
    runs-on: ubuntu-latest
    # Same third-party-registry exposure as publish-platform above.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Set version in package.json
        working-directory: editors/vscode
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build extension
        working-directory: editors/vscode
        run: npm run build

      - name: Publish universal package
        working-directory: editors/vscode
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
