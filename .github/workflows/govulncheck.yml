name: govulncheck

# Known-vulnerability gate: govulncheck is call-graph-aware, so it only fails
# on vulnerabilities whose vulnerable code this module actually reaches —
# low-noise by design. Scans against a patched stdlib, so a finding here is
# about this module rather than about the runner's Go build.
#
# Note what a green tick from this gate does and does not mean. govulncheck
# queries a live advisory database, so success is a statement about that
# database at that moment, not a durable property of the commit. A branch that
# passed hours ago can fail unchanged when an advisory lands — elps#404 was
# exactly that, and nothing in the failing branch touched a reported trace.

on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # A floor, not "stable". setup-go resolves "stable" against its own
          # version manifest and will serve whatever the hosted tool cache
          # already holds -- it handed back go1.26.5 after go1.26.6 had
          # shipped, and go1.26.6 is where the four stdlib advisories this
          # gate reported are fixed. setup-go also exports GOTOOLCHAIN=local,
          # so Go cannot upgrade past what it installed: re-running the job
          # can never clear such a finding, which is why elps#404 needed a
          # workflow change rather than a retry.
          #
          # check-latest makes setup-go consult the manifest instead of
          # settling for the cached build, and the >= floor keeps this on the
          # newest patch release rather than pinning it to go stale. Raise the
          # floor when a future advisory names a newer fix.
          go-version: ">=1.26.6"
          check-latest: true
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: govulncheck"
    runs-on: ubuntu-latest
    needs: [govulncheck]
    if: always()
    steps:
      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: ${RESULTS}"
          rc=0
          for r in ${RESULTS}; do
            # success is the ONLY pass. failure, cancelled and skipped all mean
            # the work was not demonstrably done.
            [ "$r" = "success" ] || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::A job in this workflow did not succeed (results: ${RESULTS}). Open the individual jobs above."
            exit 1
          fi
          echo "All jobs in this workflow succeeded."
