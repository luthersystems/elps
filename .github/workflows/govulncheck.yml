name: govulncheck

# Known-vulnerability gate: govulncheck is call-graph-aware, so it only fails
# on vulnerabilities whose vulnerable code this module actually reaches —
# low-noise by design. Scans against a patched stdlib, so a finding here is
# about this module rather than about the runner's Go build.
#
# Note what a green tick from this gate does and does not mean. govulncheck
# queries a live advisory database, so success is a statement about that
# database at that moment, not a durable property of the commit. A branch that
# passed hours ago can fail unchanged when an advisory lands — elps#404 was
# exactly that, and nothing in the failing branch touched a reported trace.

on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'

permissions:
  contents: read

jobs:
  govulncheck:
    # ARM for the reason spelled out on elps.yml's lint-and-test job.
    # govulncheck is installed with `go install`, so it is built from source
    # for whatever host it lands on -- there is no prebuilt-binary download to
    # go arch-shaped on. What it reports is a property of this module's call
    # graph and the pinned toolchain's stdlib, neither of which the host
    # architecture selects.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # EXACT, and identical in every workflow in this repo. Bump them
          # together or not at all: govulncheck reports standard-library
          # advisories against whatever Go compiled the scan, so a scan on a
          # different toolchain than the build answers a question nobody
          # asked -- it can go green while the artifact you ship still carries
          # the findings.
          #
          # Exact rather than a range because every looser spelling was tried
          # against this repo and each resolved somewhere unintended. Measured
          # while this line read 1.25.13, and the shape of each failure carries
          # over to any minor:
          #
          #   "stable"      -> go1.26.5   manifest's newest, a patch behind the
          #                               1.26 fix. This is elps#404.
          #   "1.25"        -> go1.25.12  newest 1.25.x IN THE MANIFEST, which
          #                               lagged go.dev; the fix was 1.25.13.
          #   ">=1.25.13"   -> go1.26.5   satisfied by crossing the minor
          #                               boundary, straight back to the
          #                               vulnerable build.
          #
          # setup-go also exports GOTOOLCHAIN=local, so Go cannot correct any
          # of that at run time. Re-running a failed job therefore never helps;
          # only changing this line does.
          #
          # This line used to be held at 1.25 by a constraint rather than a
          # preference: the then-pinned golangci-lint (v2.6) could not analyse
          # a Go 1.26 toolchain -- it did not report an error, it panicked
          # inside go/types and exited 2. golangci-lint v2.13 is built with Go
          # 1.26 and lifts that, so the whole fleet moved to 1.26 together
          # (dependabot #660 wants golang.org/x/tools v0.50.0, which declares
          # `go 1.26.0`, and luthersystems/substrate is already on 1.26).
          go-version: "1.26.8"
          check-latest: true
          cache: true
      - name: Run govulncheck
        run: |
          # Pinned to the audited release built for the build toolchain above;
          # the scanner still queries the live advisory DB (#634). v1.8.0
          # requires Go 1.26, which is why v1.7.0 stood here until the fleet
          # moved. Both were run against this tree on go1.26.8 and both scan
          # clean; v1.8.0 is the one whose x/tools matches the toolchain.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: govulncheck"
    # ARM for the reason on elps.yml's lint-and-test job.
    runs-on: ubuntu-24.04-arm
    # 5 minutes for one bash assertion over `needs` results. The scanning
    # job above already carries timeout-minutes: 15.
    timeout-minutes: 5
    needs: [govulncheck]
    if: always()
    steps:
      # NOTE: this checkout is NEW -- see the same note in elps.yml (#493).
      # SHA-pinned deliberately: the scan job above still uses a floating
      # `@v7`, which scripts/ci-gates-test.sh allowlists as pre-existing. A
      # new action should not lean on that allowlist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Delegated, NOT inlined (#493) -- see the note in elps.yml.
      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/require-jobs-succeeded.sh
