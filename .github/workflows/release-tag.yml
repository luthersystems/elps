name: Release (tag)

# On-demand release cut, dispatched from main by an operator (or an agent the
# operator directed) from the Actions UI or `gh workflow run`.
#
# The work happens in the org's shared workflow,
# luthersystems/.github/.github/workflows/release-tag.yml, so every repo gets
# the same checks and a fix lands once instead of in each copy. It refuses to
# tag unless the run is on live main, the push run of elps.yml (CI Tests)
# passed for that commit (it waits up to 30 minutes for one in progress), the
# commit has no release yet, and the version is vMAJOR.MINOR.PATCH without
# leading zeros and newer than the latest tag of its major.
#
# release_token: claude-app, because the tag must start vscode-publish.yml
# (the platform elps binaries and the VS Code Marketplace extension). GitHub
# starts no workflow for a tag the default GITHUB_TOKEN creates, so the
# official Claude App creates the release. Claude runs only the one command
# the shared workflow builds and checks. vscode-publish.yml also refuses a tag
# whose commit is not on main.
#
# NOTE: cutting a tag here PUBLISHES the VS Code extension to the
# Marketplace. Treat a release as externally visible at once.
#
# The notes come from scripts/release-notes.sh: one bullet per change on main
# since the previous tag, and every API break override added in that range.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag (vMAJOR.MINOR.PATCH, e.g. v1.48.2). Must be newer than the latest tag of its major; always cut from main HEAD."
        type: string
        required: true
      dry_run:
        description: "Print the validation, command and notes but do NOT cut the release"
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    # A called workflow cannot raise its caller's token permissions, so the
    # caller grants exactly what the shared workflow uses.
    permissions:
      actions: read # read the CI Tests runs for the release commit
      contents: read # verify the release; the Claude App token creates it
      id-token: write # Bedrock role and the Claude App token
    uses: luthersystems/.github/.github/workflows/release-tag.yml@ecf4a077df3cc9d017ed44cafcec94d396ba308b # v1.8.0
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      ci_workflow: elps.yml
      # A push run of CI Tests takes about 16 minutes.
      ci_wait_minutes: 30
      release_token: claude-app
      notes_command: bash scripts/release-notes.sh
      # ARM, as elps.yml's jobs run. The job builds nothing; the hosted ARM
      # image has the node and npm the shared workflow needs.
      runs_on: '"ubuntu-24.04-arm"'
