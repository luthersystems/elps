name: Benchmark Regression Check

on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 10, not benchstat's bare minimum of 6. Below 6 benchstat cannot compute a
  # confidence interval at all and prints "need >= 6 samples"; at 5 the
  # Mann-Whitney p-value floors at 0.008, which means only "every sample
  # ranked one way" and is exactly how environment bias masquerades as
  # significance. This was previously pinned at 5 and could not be raised,
  # because the cached baseline had been recorded at 5 and benchstat will not
  # pair arms of unequal sample count. Measuring both arms in this job
  # removes that coupling.
  BENCH_COUNT: "10"
  GO_VERSION: "1.25.13"
  # Regression gates, applied per metric class by scripts/benchstat-gate.sh.
  # elps' allocation metrics are near-deterministic (worst-case noise measured on
  # identical code: 0.18%) while sec/op noise reaches ~1.5%, and far more on a
  # contended machine -- so one threshold cannot serve both. Both are set with
  # generous headroom over the measured floor; read the threshold note in that
  # script before changing either.
  #
  # CAVEAT: those noise figures were measured on the amd64 ubuntu-latest fleet,
  # before the move to ARM. They have NOT been re-measured on the ARM pool. If
  # the gate starts firing spuriously, re-measure on identical code before
  # widening a threshold -- widening it to silence real noise you have not
  # characterised is how a gate stops meaning anything.
  #
  # One ARM datapoint exists so far (the first run where this gate reached a
  # verdict): 82 delta rows, ONE significant bad-direction move, libjson
  # Package/get-nested-baseline-2 at +1.65% (p=0.043) -- same order as the
  # +1.52% worst case measured on amd64. It bounds nothing, because that
  # comparison DOES change Go code and the move may be real rather than noise.
  # It is recorded only so the next person does not read "not re-measured" as
  # "possibly catastrophic". A proper characterisation still needs a null
  # comparison (identical code on both arms) on this pool.
  BENCH_REGRESSION_THRESHOLD_PCT: "15"
  BENCH_ALLOC_THRESHOLD_PCT: "5"
  # Pinned, not inherited from the runner's core count. `go test` appends
  # GOMAXPROCS to every benchmark name (EnvGet-2, EnvGet-4), and benchstat
  # pairs rows by that full name -- so two arms measured at different core
  # counts share NO names and benchstat pairs nothing, from a table that looks
  # entirely normal. Pinning it means a change to `runs-on` -- a different
  # line, in a different context, made by someone with no reason to think they
  # touched this gate -- cannot move the suffix. scripts/bench-arms-check.sh
  # is the backstop that names the failure if this pin is ever removed.
  #
  # 2 matches the ARM runner below. These benchmarks are single-goroutine, so
  # this constrains only the runtime's own parallelism; keeping it fixed also
  # keeps raw numbers comparable across runs as the runner pool changes.
  GOMAXPROCS: "2"

permissions:
  contents: read
  pull-requests: write
  # Read-only access to this run's own job list, for the queue watchdog below.
  actions: read

jobs:
  # Proves the regression gate can actually FAIL. This job exists because the
  # gate it guards was dead for 473 runs -- an inline `grep -E '^\S.*\+$'` that
  # no benchstat line can match -- and nothing noticed, because a gate that can
  # only report success is indistinguishable from a gate that works. It is
  # deliberately independent of the `benchmark` job: it is fast, needs no Go
  # build, and must report even when the benchmark job is cancelled or skipped.
  gates:
    name: CI Gate Self-Test
    runs-on: ubuntu-latest
    env:
      # This job has no Go toolchain on purpose -- see the comment above: it
      # must be fast and must report even when the benchmark job is cancelled.
      # The fuzz-gate checks that need `go list` / `go test` (dynamic target
      # discovery and the FuzzGateSelfTest negative control) therefore run in
      # the `fuzz` workflow, which already sets up Go and has its module cache
      # warm. Everything Go-free in the fuzz gate -- FUZZTIME parsing, the
      # "-fuzz must carry -fuzztime" scan, the workflow-shape guards and
      # shellcheck -- still runs here.
      CI_GATES_SKIP_GO: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run CI gate self-test
        run: bash scripts/ci-gates-test.sh

  # A job whose `runs-on` label matches no runner available to THIS repository
  # does not fail -- it queues, and a queued job publishes no check status at
  # all. The board then shows the other checks, all green, and reads as a pass.
  # That is not hypothetical here: `ubuntu-arm-4core-150gb` (real, but shared
  # with substrate rather than elps) left the benchmark job queued across five
  # consecutive pushes, reporting nothing each time.
  #
  # `timeout-minutes` cannot cover this -- its clock starts when a job begins
  # running. So this watchdog runs on a runner that is always available and
  # polls the run's own job list, turning "silently absent" into "loudly red".
  # Logic lives in scripts/ci-queue-watchdog.cjs so it is reviewable and
  # guarded by scripts/ci-gates-test.sh rather than buried in YAML.
  queue-watchdog:
    name: Runner Reachability Watchdog
    runs-on: ubuntu-latest
    # Generous: the budget below is the real bound, and this only backstops a
    # watchdog that itself wedges.
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Watch for a job that never starts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          # Must match the watched job's `name:` EXACTLY. The watchdog reports
          # a mismatch rather than waiting out the budget on a typo.
          WATCH_JOB: Benchmark Comparison
          # Repo variable so a genuinely busy pool can be accommodated from
          # settings, without a code change.
          QUEUE_BUDGET_MINUTES: ${{ vars.BENCH_QUEUE_BUDGET_MINUTES || '15' }}
        with:
          script: |
            const watchdog = require('./scripts/ci-queue-watchdog.cjs')
            await watchdog({ github, context, core })

  benchmark:
    name: Benchmark Comparison
    # ARM, deliberately. The consumers that pin this module ship ARM, so
    # benchmarking elps on amd64 tuned against a machine nobody runs -- and
    # that matters most for exactly what this gate exists to catch, since
    # struct layout, padding and GC scan extent are not arch-invariant.
    #
    # `2vcpu-ubuntu-2204-arm` is the ARM runner actually shared with THIS repo
    # (Settings -> Actions -> Runners). An earlier revision named
    # ubuntu-arm-4core-150gb, which substrate uses but elps cannot reach, so
    # the job sat queued across five pushes -- silently, because a job that
    # never starts reports no status to fail on.
    #
    # Two vCPUs is enough, and arguably better: these benchmarks are
    # single-goroutine, so the extra cores only served the runtime, and fewer
    # cores means less scheduler noise in the timings. It does halve the
    # GOMAXPROCS suffix benchstat keys on (EnvGet-2, not EnvGet-4) -- harmless
    # now that both arms are measured in one job, but it would have been fatal
    # to the old cached-baseline design, which would have compared EnvGet-4
    # against EnvGet-2 and paired nothing at all.
    #
    # `vars.BENCH_RUNNER` is an escape hatch: if the ARM pool is unavailable
    # the runner can be repointed from repo settings without a code change.
    # It is safe to flip because both arms are measured in this job on
    # whatever runner it lands on -- a swap changes the absolute numbers but
    # never compares across architectures. It cannot move the benchmark-name
    # suffix either, because GOMAXPROCS is pinned at the workflow level; see
    # the note there for why that matters.
    #
    # NOTE: `runs-on` cannot read the `env` context, which is why this is a
    # literal plus a `vars` override rather than a workflow-level env var.
    runs-on: ${{ vars.BENCH_RUNNER || '2vcpu-ubuntu-2204-arm' }}
    steps:
      # Two working trees, measured on the SAME runner in the SAME job. This
      # replaces the cached-baseline design, which compared this PR against
      # results recorded on a different machine at a different time and
      # attributed the hardware delta to the code delta. GitHub's hosted pool
      # is heterogeneous -- consecutive runs of IDENTICAL code landed on an
      # EPYC 7763 and an EPYC 9V74 and benchstat refused to pair them at all,
      # failing the gate with "cannot interpret". Same silicon, same thermal
      # state, same toolchain is the only way the comparison means anything.
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: pr

      - name: Check out PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # Both trees are checked out into subdirectories, so there is no
          # go.sum at the workspace root for setup-go to key its cache on.
          cache-dependency-path: pr/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Interleaved, alternating arms every round rather than running all of
      # one arm then all of the other. A runner that slows down partway
      # through -- thermal throttling, a noisy neighbour -- biases a
      # block-ordered run entirely into whichever arm ran second. Alternating
      # spreads that drift across both arms instead of pooling it into one.
      # Each round contributes one sample per arm, so BENCH_COUNT rounds give
      # BENCH_COUNT samples each.
      #
      # `set -o pipefail` is load-bearing: without it the exit status of
      # `go test ... | tee` is tee's, which is 0 even when the benchmarks fail
      # to compile or panic. The step would go green, the output files would
      # hold error text, and the comparison downstream would be meaningless.
      # GitHub's default shell is `bash -e` WITHOUT pipefail, so it must be
      # set explicitly.
      #
      # Body lives in scripts/bench-run-arms.sh. Bash inside a `run: |` block is
      # not syntax-checked, not shellchecked and not testable; a script in
      # scripts/ is all three, via scripts/ci-gates-test.sh. Referenced through
      # $GITHUB_WORKSPACE/pr because BOTH checkouts in this job are relocated,
      # so a root-relative `scripts/...` would exit 127.
      - name: Run benchmarks (both arms, interleaved)
        run: bash "${GITHUB_WORKSPACE}/pr/scripts/bench-run-arms.sh"

      - name: Compare with benchstat
        if: github.event_name == 'pull_request'
        id: benchstat
        # Body lives in scripts/bench-compare.sh -- syntax-checked, shellchecked
        # and fixture-tested by scripts/ci-gates-test.sh, which a `run: |` block
        # can never be. Referenced through $GITHUB_WORKSPACE/pr because BOTH
        # checkouts in this job are relocated, so a root-relative `scripts/...`
        # would exit 127 -- which this workflow once reported as "Benchmark
        # regressions detected", a real-looking failure with a fictional cause.
        run: bash "${GITHUB_WORKSPACE}/pr/scripts/bench-compare.sh"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          BENCH_RESULT: ${{ steps.benchstat.outputs.result }}
        with:
          script: |
            const body = process.env.BENCH_RESULT;
            const marker = '<!-- benchmark-comparison-comment -->';
            const fullBody = marker + '\n' + body;

            let existingComment = null;
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              existingComment = comments.find(c => c.body.includes(marker));
            } catch (e) {
              core.warning(`Could not list PR comments: ${e.message}`);
            }

            try {
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: fullBody,
                });
                core.info(`Updated existing benchmark comment ${existingComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fullBody,
                });
                core.info('Created new benchmark comment');
              }
            } catch (e) {
              core.warning(`Could not post PR comment: ${e.message}. This is expected for PRs from forks.`);
            }

      # `always()` so this cannot be silently skipped when an earlier step is
      # cancelled or fails: a gate that only runs on the happy path is not a
      # gate. `skipped` (no cached baseline) and `0` (clean) are the only values
      # that pass; 1 = regression and 2 = uninterpretable both fail.
      - name: Fail on regressions
        if: >-
          always() && github.event_name == 'pull_request' &&
          steps.benchstat.outputs.gate_status != 'skipped' &&
          steps.benchstat.outputs.gate_status != '0'
        # Body lives in scripts/bench-gate-fail.sh, where the three-way split
        # (1 = regressions, 2 = uninterpretable, anything else = no verdict
        # reached) is fixture-tested by scripts/ci-gates-test.sh. The verdict
        # arrives via env rather than a `${{ }}` expansion so the script is
        # runnable, and testable, outside Actions.
        env:
          GATE_STATUS: ${{ steps.benchstat.outputs.gate_status }}
        run: bash "${GITHUB_WORKSPACE}/pr/scripts/bench-gate-fail.sh"

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: benchmark"
    runs-on: ubuntu-latest
    needs: [gates, queue-watchdog, benchmark]
    if: always()
    steps:
      # NOTE: this checkout is NEW. This job previously carried its assertion
      # as inline bash and so needed nothing from the repository. Moving that
      # body into scripts/require-jobs-succeeded.sh -- so it is shellchecked and
      # fixture-tested like every other gate here -- means the file has to be
      # present. This is the one structural change in the extraction: it adds a
      # failure mode (a checkout that does not complete now fails the required
      # check) that did not exist before. Same SHA pin as the other jobs.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/require-jobs-succeeded.sh
