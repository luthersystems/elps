name: Benchmark Regression Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_COUNT: "5"
  GO_VERSION: "1.25"
  # Regression gates, applied per metric class by scripts/benchstat-gate.sh.
  # elps' allocation metrics are near-deterministic (measured worst-case noise on
  # identical code: 0.19%) while sec/op noise reaches 33.83%, so one threshold
  # cannot serve both. Read the threshold note in that script before changing
  # these -- they are deliberately conservative and want recalibrating against
  # real CI runs.
  BENCH_REGRESSION_THRESHOLD_PCT: "50"
  BENCH_ALLOC_THRESHOLD_PCT: "5"

permissions:
  contents: read
  pull-requests: write

jobs:
  # Proves the regression gate can actually FAIL. This job exists because the
  # gate it guards was dead for 473 runs -- an inline `grep -E '^\S.*\+$'` that
  # no benchstat line can match -- and nothing noticed, because a gate that can
  # only report success is indistinguishable from a gate that works. It is
  # deliberately independent of the `benchmark` job: it is fast, needs no Go
  # build, and must report even when the benchmark job is cancelled or skipped.
  gates:
    name: CI Gate Self-Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run CI gate self-test
        run: bash scripts/ci-gates-test.sh

  benchmark:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # On PRs: try to restore cached baseline results from the latest main push.
      # Each main push saves with a unique key (benchmark-baseline-<sha>).
      # restore-keys prefix matching finds the most recent one.
      - name: Restore cached baseline
        if: github.event_name == 'pull_request'
        id: cache-baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: bench-baseline.txt
          key: benchmark-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: benchmark-baseline-

      - name: Run benchmarks
        run: |
          # `set -o pipefail` is load-bearing: without it the exit status of
          # `go test ... | tee` is tee's, which is 0 even when the benchmarks
          # fail to compile or panic. The step would go green, bench-current.txt
          # would hold error text, and the comparison downstream would be
          # meaningless. GitHub's default shell is `bash -e` WITHOUT pipefail,
          # so this has to be set explicitly.
          set -o pipefail
          go test -bench=. -benchmem -benchtime=100ms -count=${{ env.BENCH_COUNT }} \
            -run='^$' -timeout=10m ./... | tee bench-current.txt

      # On push to main: save results as the new baseline for future PRs.
      # Uses a per-SHA key so each push creates a new entry. The PR restore
      # step uses restore-keys prefix matching to find the most recent one.
      # The path must match the restore step (bench-baseline.txt).
      - name: Save baseline to cache
        if: github.event_name == 'push'
        run: cp bench-current.txt bench-baseline.txt

      - name: Upload baseline cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: bench-baseline.txt
          key: benchmark-baseline-${{ github.sha }}

      - name: Compare with benchstat
        if: github.event_name == 'pull_request'
        id: benchstat
        run: |
          set -uo pipefail
          if [ ! -s bench-baseline.txt ]; then
            echo "No cached baseline found — showing PR results only."
            # `skipped` (not 0) so the gate step below can tell "nothing to
            # compare" apart from "compared and found clean".
            echo "gate_status=skipped" >> "$GITHUB_OUTPUT"
            {
              echo 'result<<BENCHSTAT_EOF'
              echo '## Benchmark Results (no baseline to compare)'
              echo ''
              echo 'No cached baseline from main found. Results will be cached'
              echo 'once this PR merges and the next push to main runs.'
              echo ''
              echo '```'
              cat bench-current.txt
              echo '```'
              echo 'BENCHSTAT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # benchstat's own exit code is captured rather than discarded with
          # `|| true`: if it crashed, its error text is all that lands in
          # benchstat-output.txt, and benchstat-gate.sh turns that into a hard
          # exit 2 ("cannot interpret") instead of a silent pass. Swallowing it
          # here is what made a benchstat failure indistinguishable from a clean
          # comparison.
          bench_rc=0
          benchstat base=bench-baseline.txt pr=bench-current.txt \
            > benchstat-output.txt 2>&1 || bench_rc=$?
          if [ "$bench_rc" -ne 0 ]; then
            echo "::warning::benchstat exited ${bench_rc}; the gate will adjudicate its output."
          fi

          {
            echo 'result<<BENCHSTAT_EOF'
            echo '## Benchmark Comparison (main baseline vs PR)'
            echo ''
            echo '<details>'
            echo '<summary>Click to expand benchstat output</summary>'
            echo ''
            echo '```'
            cat benchstat-output.txt
            echo '```'
            echo ''
            echo '</details>'
            echo ''
            echo '_Compared against cached baseline from the latest main push._'
            echo 'BENCHSTAT_EOF'
          } >> "$GITHUB_OUTPUT"

          # The gate lives in scripts/benchstat-gate.sh so it can be unit-tested
          # (scripts/ci-gates-test.sh) and run locally (make ci-gates-test).
          # It exits 0 = clean, 1 = regression, 2 = could not interpret.
          gate_status=0
          ./scripts/benchstat-gate.sh benchstat-output.txt || gate_status=$?
          echo "gate_status=${gate_status}" >> "$GITHUB_OUTPUT"
          case "$gate_status" in
            0) echo "No benchmark regression at or above the configured gates." ;;
            1) echo "::warning::Benchstat detected a significant benchmark regression." ;;
            *) echo "::warning::The benchmark comparison could not be interpreted." ;;
          esac

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          BENCH_RESULT: ${{ steps.benchstat.outputs.result }}
        with:
          script: |
            const body = process.env.BENCH_RESULT;
            const marker = '<!-- benchmark-comparison-comment -->';
            const fullBody = marker + '\n' + body;

            let existingComment = null;
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              existingComment = comments.find(c => c.body.includes(marker));
            } catch (e) {
              core.warning(`Could not list PR comments: ${e.message}`);
            }

            try {
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: fullBody,
                });
                core.info(`Updated existing benchmark comment ${existingComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fullBody,
                });
                core.info('Created new benchmark comment');
              }
            } catch (e) {
              core.warning(`Could not post PR comment: ${e.message}. This is expected for PRs from forks.`);
            }

      # `always()` so this cannot be silently skipped when an earlier step is
      # cancelled or fails: a gate that only runs on the happy path is not a
      # gate. `skipped` (no cached baseline) and `0` (clean) are the only values
      # that pass; 1 = regression and 2 = uninterpretable both fail.
      - name: Fail on regressions
        if: >-
          always() && github.event_name == 'pull_request' &&
          steps.benchstat.outputs.gate_status != 'skipped' &&
          steps.benchstat.outputs.gate_status != '0'
        run: |
          status='${{ steps.benchstat.outputs.gate_status }}'
          if [ "$status" = '2' ]; then
            echo "::error::The benchmark comparison could not be interpreted (gate exit 2). This is a hard failure by design — a gate that cannot read its input must never report success. See the job log above."
          else
            echo "::error::Benchmark regressions detected (gate exit ${status:-<unset>}). Review the benchstat comparison in the PR comment and the gate report in the job log."
          fi
          exit 1
