name: CI Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9
        with:
          version: v2.6
          args: --timeout=5m ./...

      - name: Tests
        run: make test

      - name: Race detection (full)
        run: make race

      - name: Singleton integrity (elpscheck)
        run: make test-elpscheck

      - name: Check formatting
        run: |
          go build -o elps .
          ./elps fmt -l --exclude 'grammar' ./...

      - name: Lint ELPS source
        run: ./elps lint --workspace=. --exclude 'grammar' --include '_examples' ./...

      - name: Check missing documentation
        run: ./elps doc -m

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...
