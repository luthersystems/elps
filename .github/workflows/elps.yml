name: CI Tests
on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # 30 minutes against an observed 3m57s (golangci-lint, make test,
    # make race, elpscheck, elps fmt/lint/doc). `make race` alone is ~2m and is
    # the part most sensitive to a slow runner, so the headroom is deliberate.
    # A liveness bound, not a performance budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Fails when a confidential customer name appears anywhere in the
      # tracked tree.  The forbidden term is assembled from character codes
      # inside the script -- never written literally -- so neither the
      # script nor this workflow can trip the guard, and nothing has to be
      # excluded from the scan.  Word-boundary matching keeps unrelated
      # English words from false-positiving; the script self-tests both
      # directions on every run.  See scripts/confidentiality-guard.sh.
      - name: Confidentiality guard
        run: bash scripts/confidentiality-guard.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.6
          args: --timeout=5m ./...

      - name: Tests
        run: make test

      - name: Race detection (full)
        run: make race

      - name: Singleton integrity (elpscheck)
        run: make test-elpscheck

      # The seal contract's static half.  golangci-lint above checks Go style;
      # this checks the three rules that exist because a raw Go write can
      # launder around the seal bit -- package-level LVal tables, writes to
      # LVal fields on values the function did not construct, and escaping
      # uncopied *token.Location pointers.  ~3s.
      #
      # Runs TWO passes.  The second is the whole reason this is a make target
      # rather than one line here: elpsvet accepts -tags and silently ignores
      # it (x/tools registers that flag as a deliberate no-op), so the build
      # config has to travel in GOFLAGS instead.  Without the tagged pass the
      # entire -tags elpscheck surface is invisible to the gate.  See the
      # comment on the `elpsvet` target in the Makefile.
      - name: Seal contract (elpsvet)
        run: make elpsvet

      - name: Check formatting
        run: |
          go build -o elps .
          # No --exclude here, deliberately. The 'grammar' carve-out existed
          # only because `elps fmt` rewrote editors/vscode/test/grammar/*.lisp,
          # whose `; <-` / `; ^^^` comments are POSITIONAL assertions about the
          # line above -- so the reflow changed what the fixture asserted. The
          # carve-out made CI green by not looking, which also meant CI could
          # never catch a future formatter change that broke those files again.
          # Now that a column-0 comment stays in column 0 they are fixed points,
          # so the fixtures are back under the gate.
          ./elps fmt -l ./...

      - name: Lint ELPS source
        run: ./elps lint --workspace=. --exclude 'grammar' --include '_examples' ./...

      - name: Check missing documentation
        run: ./elps doc -m

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    # 20 minutes against an observed 1m06s. Windows runners have the
    # slowest and most variable image/toolchain setup of the pool, hence the
    # wide margin on an otherwise trivial build+vet.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: build & test"
    runs-on: ubuntu-latest
    # 5 minutes against an observed 2s. This job's name is the one in
    # branch protection; wedged here means the PR is blocked with no red.
    timeout-minutes: 5
    needs: [lint-and-test, build-windows]
    if: always()
    steps:
      # NOTE: this checkout is NEW, and is the one structural cost of moving
      # the assertion into scripts/require-jobs-succeeded.sh (#493). The body
      # used to be inline bash and so needed nothing from the repository; the
      # shared script has to be present to be run. It adds a failure mode -- a
      # checkout that does not complete now fails the required check -- which
      # is the correct direction: it fails loudly rather than passing over an
      # assertion that never executed. Same trade benchmark.yml took in #485,
      # same SHA pin as the other jobs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Delegated, NOT inlined (#493). This body was a verbatim copy of the
      # pre-#485 script logic, and carried #485's hole with it: `for r in
      # ${RESULTS}` never enters its body when RESULTS is empty, so the job
      # printed "All jobs in this workflow succeeded" and exited 0 having
      # checked nothing. Fixing the script did not fix the copies. The shared
      # script is shellchecked and fixture-tested by scripts/ci-gates-test.sh;
      # an inline copy is none of those things, and that file cannot see it.
      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/require-jobs-succeeded.sh
