name: CI Tests
on:
  pull_request:
    branches:
      - main
      # Stacked PRs. Multi-part work here is reviewed as a chain of PRs
      # whose base is another claude/* branch. This filter matches the
      # PR's BASE, so with `main` alone none of these workflows fired on
      # such a PR -- and a board showing only the two branch-agnostic
      # Socket checks reads as a pass when in fact nothing ran.
      - 'claude/**'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    # THE RATIONALE FOR ubuntu-24.04-arm, ONCE. Every other Linux job in this
    # repository carries a one-line pointer back here rather than a copy.
    #
    # ARM, and specifically the 4-vCPU GitHub-hosted image rather than the
    # `2vcpu-ubuntu-2204-arm` box the benchmark job used to name. This job is
    # dominated by two PARALLEL Go test runs -- `make race` and
    # `make test-elpscheck` were 2m39s and 1m09s of a 5m27s job on
    # ubuntu-latest (run 32917687879) -- so halving the core count would cost
    # more than ARM's per-core advantage returns. `ubuntu-24.04-arm` keeps 4
    # vCPUs (16 GB RAM, Cobalt 100), is free for public repositories, and is
    # the same distro release `ubuntu-latest` currently resolves to, so the
    # only deliberate variable is the architecture.
    #
    # It is a STANDARD GitHub-hosted label, not an org runner-group label, so
    # it cannot reproduce the "queues forever, reports nothing" failure that
    # `ubuntu-arm-4core-150gb` caused here (see benchmark.yml). Public repos
    # only: the label is rejected in private ones, which elps is not.
    #
    # setup-go's cache key includes the architecture, so the first run after
    # this lands is cold by construction and the comparison against the 5m27s
    # baseline is only fair from the second run onward.
    #
    # scripts/ci-gates-test.sh pins this: every Linux `runs-on` in this
    # repository must be `ubuntu-24.04-arm`, so a workflow added later on
    # ubuntu-latest fails the gate rather than quietly splitting the fleet.
    # Windows is the deliberate exception -- build-windows below exists FOR
    # the platform coverage.
    runs-on: ubuntu-24.04-arm
    # 30 minutes against an observed 3m57s (golangci-lint, make test,
    # make race, elpscheck, elps fmt/lint/doc). `make race` alone is ~2m and is
    # the part most sensitive to a slow runner, so the headroom is deliberate.
    # A liveness bound, not a performance budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Fails when a confidential customer name appears anywhere in the
      # tracked tree.  The forbidden term is assembled from character codes
      # inside the script -- never written literally -- so neither the
      # script nor this workflow can trip the guard, and nothing has to be
      # excluded from the scan.  Word-boundary matching keeps unrelated
      # English words from false-positiving; the script self-tests both
      # directions on every run.  See scripts/confidentiality-guard.sh.
      - name: Confidentiality guard
        run: bash scripts/confidentiality-guard.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.6
          args: --timeout=5m ./...
          # `config verify` downloads the JSON schema from golangci-lint.run
          # on every run and was the one step in this job that needed a host
          # other than GitHub.  When that fetch timed out the job died here,
          # before a single test had run, and the rollup went red for a
          # reason no PR could fix (three PRs in one day: #586 twice, #573).
          # The check itself is worth keeping: `golangci-lint run` does NOT
          # reject an unknown key in .golangci.yml (a misspelled section runs
          # to "0 issues"), only the schema check does.  So it runs in the
          # next step against the schema vendored in .github/, offline.
          verify: false

      # The schema check `verify: true` used to run, against the checked-in
      # copy of the schema so it needs no network.  The Makefile derives the
      # schema filename from the `version:` above, so bumping golangci-lint
      # without re-vendoring the schema fails here with a missing file, not
      # silently validating against the old one.  golangci-lint is on PATH
      # because the action above adds its install dir (core.addPath in
      # src/run.ts, before the install-only branch).
      - name: golangci-lint config schema
        run: make check-golangci-config

      - name: Tests
        run: make test

      - name: Race detection (full)
        run: make race

      - name: Singleton integrity (elpscheck)
        run: make test-elpscheck

      # The seal contract's static half.  golangci-lint above checks Go style;
      # this checks the four rules that exist because a raw Go write can
      # launder around the seal bit -- package-level LVal tables, writes to
      # LVal fields on values the function did not construct, escaping
      # uncopied *token.Location pointers, and native payloads minted
      # without a fork-safety classification.  ~3s.
      #
      # Runs TWO passes.  The second is the whole reason this is a make target
      # rather than one line here: elpsvet accepts -tags and silently ignores
      # it (x/tools registers that flag as a deliberate no-op), so the build
      # config has to travel in GOFLAGS instead.  Without the tagged pass the
      # entire -tags elpscheck surface is invisible to the gate.  See the
      # comment on the `elpsvet` target in the Makefile.
      - name: Seal contract (elpsvet)
        run: make elpsvet

      # The benchmark harness SHARES one sealed parse across every
      # iteration's Runtime rather than deep-copying it per iteration
      # (elpstest.RunBenchmark). What makes that safe is VerifySealedASTs
      # re-fingerprinting the shared tree afterwards -- but that verifier is
      # a nil call unless `elpscheck` is set, and the benchmark workflow runs
      # `go test -bench=.` with NO build tags. Until this step existed, every
      # benchmarked path in CI ran with its own safety net switched off, and
      # nothing about that was visible: literal corruption there is
      # DETERMINISTIC, so it produces neither a value differential between
      # iterations nor a divergence from a fresh parse. Only the fingerprint
      # oracle sees it.
      #
      # One iteration per benchmark (-benchtime=1x) is all a fingerprint
      # check needs, and the tagged build cache is already warm from the step
      # above, so this costs seconds. It does not touch the untagged
      # measurement run in benchmark.yml -- those numbers must stay untagged
      # and comparable with the base arm.
      - name: Sealed-AST oracle over the benchmarks (elpscheck)
        run: make bench-elpscheck-smoke

      - name: Check formatting
        run: |
          go build -o elps .
          # No --exclude here, deliberately. The 'grammar' carve-out existed
          # only because `elps fmt` rewrote editors/vscode/test/grammar/*.lisp,
          # whose `; <-` / `; ^^^` comments are POSITIONAL assertions about the
          # line above -- so the reflow changed what the fixture asserted. The
          # carve-out made CI green by not looking, which also meant CI could
          # never catch a future formatter change that broke those files again.
          # Now that a column-0 comment stays in column 0 they are fixed points,
          # so the fixtures are back under the gate.
          ./elps fmt -l ./...

      - name: Lint ELPS source
        run: ./elps lint --workspace=. --exclude 'grammar' --include '_examples' ./...

      - name: Check missing documentation
        run: ./elps doc -m

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    # 20 minutes against an observed 1m06s. Windows runners have the
    # slowest and most variable image/toolchain setup of the pool, hence the
    # wide margin on an otherwise trivial build+vet.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # THE ONE CHECK TO REQUIRE FOR THIS WORKFLOW.
  #
  # Branch protection matches a required status check by NAME, so requiring the
  # individual jobs means editing repo settings every time a job is added,
  # renamed or resharded -- and forgetting to leaves the new job unguarded
  # while the board still looks fully green. That is the same "green by not
  # looking" shape as an excluded path or a queued job.
  #
  # This job has a fixed name and depends on every other job in the workflow,
  # so it is the only name that ever needs to be in the required list. Adding a
  # job means adding it to `needs:` here -- and scripts/ci-gates-test.sh fails
  # the PR if you don't, so the aggregate cannot silently stop covering
  # something.
  #
  # always() plus an explicit success check, because `needs` alone would SKIP
  # this job when an upstream one fails, and a skipped required check reads as
  # green rather than red.
  required:
    name: "Required: build & test"
    # ARM for the reason spelled out on lint-and-test above. This job is one
    # checkout and one bash assertion, so the architecture buys it nothing --
    # it moves so that "every Linux job is on ubuntu-24.04-arm" is a rule with
    # no exceptions to remember, which is what makes it checkable.
    runs-on: ubuntu-24.04-arm
    # 5 minutes against an observed 2s. This job's name is the one in
    # branch protection; wedged here means the PR is blocked with no red.
    timeout-minutes: 5
    needs: [lint-and-test, build-windows]
    if: always()
    steps:
      # NOTE: this checkout is NEW, and is the one structural cost of moving
      # the assertion into scripts/require-jobs-succeeded.sh (#493). The body
      # used to be inline bash and so needed nothing from the repository; the
      # shared script has to be present to be run. It adds a failure mode -- a
      # checkout that does not complete now fails the required check -- which
      # is the correct direction: it fails loudly rather than passing over an
      # assertion that never executed. Same trade benchmark.yml took in #485,
      # same SHA pin as the other jobs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Delegated, NOT inlined (#493). This body was a verbatim copy of the
      # pre-#485 script logic, and carried #485's hole with it: `for r in
      # ${RESULTS}` never enters its body when RESULTS is empty, so the job
      # printed "All jobs in this workflow succeeded" and exited 0 having
      # checked nothing. Fixing the script did not fix the copies. The shared
      # script is shellchecked and fixture-tested by scripts/ci-gates-test.sh;
      # an inline copy is none of those things, and that file cannot see it.
      - name: Assert every job in this workflow succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/require-jobs-succeeded.sh
